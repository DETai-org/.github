name: Build DETai Telegram Avatar

on:
  push:
    paths:
      - ".github/workflows/build-detai-telegram-avatar.yml"

permissions:
  contents: write

jobs:
  build-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch canonical DETai OG asset
        run: |
          mkdir -p assets/telegram
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/DETai-org/sites/main/assets/organizations-detai/site-default.jpg \
            --output /tmp/site-default.jpg

      - name: Create square Telegram avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/site-default.jpg')
          output = Path('assets/telegram/detai-avatar.jpg')

          with Image.open(source) as image:
              image = image.convert('RGB')
              width, height = image.size
              side = min(width, height)
              left = (width - side) // 2
              top = (height - side) // 2
              square = image.crop((left, top, left + side, top + side))
              square = square.resize((1024, 1024), Image.Resampling.LANCZOS)
              square.save(output, format='JPEG', quality=95, optimize=True, progressive=True)

          print(f'Created {output} from {width}x{height} center crop -> 1024x1024')
          PY

      - name: Record deterministic provenance
        run: |
          cat > assets/telegram/README.md <<'EOF'
          # DETai Telegram avatar

          `detai-avatar.jpg` is a deterministic square derivative of the canonical DETai homepage social-preview asset.

          - Source repository: `DETai-org/sites`
          - Source path: `assets/organizations-detai/site-default.jpg`
          - Source dimensions: `1200 × 630`
          - Transform: centered `630 × 630` crop, resized to `1024 × 1024`
          - Content changes: none; crop/resize only

          The derivative is intended for DETai organization/channel avatar surfaces.
          EOF

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/telegram/detai-avatar.jpg assets/telegram/README.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add DETai Telegram avatar derivative"
          git push
